function buildSched(n=104){
  const s=new Date("2026-06-26"),r=[];
  for(let i=0;i<n;i++){const d=new Date(s);d.setDate(s.getDate()+i*14);r.push(d);}
  return r;
}
const SCHED=buildSched();
function fpd(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function nextBonus(from){
  const bm={};
  SCHED.forEach((d,i)=>{if(i<from)return;const k=d.getFullYear()+"-"+d.getMonth();if(!bm[k])bm[k]=[];bm[k].push(d);});
  for(const ds of Object.values(bm)){if(ds.length===3)return ds[2];}
  return null;
}
function initDates(){
  const t=new Date();t.setHours(0,0,0,0);let idx=0;
  for(let i=0;i<SCHED.length;i++){const d=new Date(SCHED[i]);d.setHours(0,0,0,0);if(d<=t)idx=i;else break;}
  return{c1:SCHED[idx],c2:SCHED[idx+1],c3:nextBonus(idx)};
}

// Save & Bake function
function saveAndBake(dataJson){
  try{
    const esc=dataJson.replace(/\\/g,'\\\\').replace(/`/g,'\\`');
    const html=document.documentElement.outerHTML;
    const updated=html.replace(/\/\/ BAKED_DATA_START[\s\S]*?\/\/ BAKED_DATA_END/,
      '// BAKED_DATA_START\nconst BAKED_DATA = `'+esc+'`;\n// BAKED_DATA_END');
    const blob=new Blob([updated],{type:"text/html"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="BeardedDad-Bills-Tracker.html";
    a.click();
    URL.revokeObjectURL(a.href);
    return true;
  }catch(e){console.error(e);return false;}
}

function SaveBakeButton({periods,paycheck,activePid,debts,history,lastSaved}){
  const [status,setStatus]=useState("idle");
  const handle=()=>{
    setStatus("saving");
    try{
      const data=JSON.stringify({periods,paycheck,activePid,debts,history:history||[]});
      localStorage.setItem("btrk-v6",data);
      saveAndBake(data);
      setStatus("saved");
    }catch(e){console.error(e);setStatus("error");}
    setTimeout(()=>setStatus("idle"),4000);
  };
  const label=status==="saving"?"Saving…":status==="saved"?"✓ Saved! Replace your file on GitHub":status==="error"?"⚠ Save failed":"💾 Save & Bake — Lock In Your Changes";
  const bg=status==="saved"?"linear-gradient(135deg,#22c55e,#14532d)":status==="error"?"linear-gradient(135deg,#ef4444,#7f1d1d)":status==="saving"?"#2a2f3e":"linear-gradient(135deg,#f59e0b,#78350f)";
  return h("div",{style:{marginTop:14}},
    h("button",{onClick:handle,disabled:status==="saving",style:{width:"100%",padding:"13px",background:bg,color:"#fff",border:"none",borderRadius:10,fontWeight:800,fontSize:14,cursor:status==="saving"?"default":"pointer",transition:"all 0.2s"}},label),
    h("div",{style:{marginTop:6,fontSize:11,color:"#6b7280",textAlign:"center",lineHeight:1.5}},"Downloads updated file. Upload to GitHub to sync all devices."),

  );
}

    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
      h("span",{style:{fontSize:11,color:"#8b92a5"}},"Snowball order (lowest balance first) · tap to edit"),
      h("button",{onClick:()=>setShowAdd(!showAdd),style:{background:acc,border:"none",color:"#fff",borderRadius:7,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}},"+ Add")
    ),
    showAdd&&h("div",{style:{background:"#1a1f2e",border:"1px solid "+acc,borderRadius:10,padding:12,marginBottom:12}},
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}},
        h("div",{style:{gridColumn:"1/-1"}},h("label",{style:S.lbl},"Name"),h("input",{value:newDebt.name,onChange:e=>setNewDebt({...newDebt,name:e.target.value}),style:S.inp,placeholder:"Card or loan name"})),
        h("div",null,h("label",{style:S.lbl},"Min Payment"),h("input",{type:"number",step:"0.01",value:newDebt.minimum,onChange:e=>setNewDebt({...newDebt,minimum:e.target.value}),style:S.inp,placeholder:"0.00"})),
        h("div",null,h("label",{style:S.lbl},"Balance"),h("input",{type:"number",step:"0.01",value:newDebt.balance,onChange:e=>setNewDebt({...newDebt,balance:e.target.value}),style:S.inp,placeholder:"0.00"})),
        h("div",null,h("label",{style:S.lbl},"Credit Line"),h("input",{type:"number",step:"0.01",value:newDebt.creditLine,onChange:e=>setNewDebt({...newDebt,creditLine:e.target.value}),style:S.inp,placeholder:"0.00"})),
        h("div",null,h("label",{style:S.lbl},"As Of"),h("input",{value:newDebt.asOf,onChange:e=>setNewDebt({...newDebt,asOf:e.target.value}),style:S.inp,placeholder:"26-Jun"}))
      ),
      h("button",{onClick:onAddDebt,style:{background:acc,border:"none",color:"#fff",borderRadius:7,padding:"7px 15px",fontWeight:600,cursor:"pointer",fontSize:13}},"Add Debt")
    ),
    h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
      ...debts.map((debt,idx)=>{
        const bal=parseFloat(debt.balance)||0,lim=parseFloat(debt.creditLine)||0,avail=lim-bal,up=lim>0?Math.round((bal/lim)*100):0,isT=idx===0;
        return h("div",{key:debt.id,style:{background:isT?"#0f1f12":"#1a1f2e",border:"1px solid "+(isT?"#22c55e55":"#1e2230"),borderRadius:10,padding:"12px 14px 10px"}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
            h("div",{style:{display:"flex",alignItems:"center",gap:8}},
              isT&&h("span",{style:{fontSize:10,background:"#22c55e",color:"#000",borderRadius:4,padding:"2px 7px",fontWeight:800}},"TARGET"),
              h("div",null,
                h("div",{style:{fontWeight:700,fontSize:15,color:"#f0f2f8"}},debt.name),
                debt.asOf&&h("div",{style:{fontSize:11,color:"#8b92a5",marginTop:1}},"As of "+debt.asOf)
              )
            ),
            h("button",{onClick:()=>onDelete(debt.id),style:{background:"none",border:"none",color:"#6b7280",cursor:"pointer",fontSize:20,padding:"0 4px"}},"×")
          ),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}},
            h(DebtBlock,{label:"Min Due",value:debt.minimum,field:"minimum",debtId:debt.id,editing:editingDebt,setEditing:setEditingDebt,onUpdate,color:"#f59e0b"}),
            h(DebtBlock,{label:"Balance",value:debt.balance,field:"balance",debtId:debt.id,editing:editingDebt,setEditing:setEditingDebt,onUpdate,color:"#ef4444"}),
            h(DebtBlock,{label:"Credit Limit",value:debt.creditLine,field:"creditLine",debtId:debt.id,editing:editingDebt,setEditing:setEditingDebt,onUpdate,color:"#6366f1"}),
            h("div",{style:{background:"#0f1117",borderRadius:7,padding:"8px 10px"}},
              h("div",{style:{fontSize:10,color:"#8b92a5",textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}},"Available"),
              h("div",{style:{fontSize:16,fontWeight:800,color:avail<0?"#ef4444":"#22c55e"}},avail<0?"("+fmt(Math.abs(avail))+")":fmt(avail)),
              h("div",{style:{fontSize:10,color:"#6b7280",marginTop:2}},"auto-calculated")
            )
          ),
          h("div",{style:{background:"#2a2f3e",borderRadius:4,height:6}},
            h("div",{style:{width:Math.min(up,100)+"%",height:"100%",borderRadius:4,background:up>70?"#ef4444":up>30?"#f59e0b":"#22c55e"}})
          ),
          h("div",{style:{fontSize:11,color:"#8b92a5",marginTop:4,textAlign:"right"}},up+"% utilized")
        );
      })
    ),
    h("div",{style:{background:"#13161f",border:"1px solid #22c55e44",borderRadius:10,padding:"12px 14px",marginTop:10}},
      h("div",{style:{fontSize:11,color:"#22c55e",fontWeight:800,textTransform:"uppercase",letterSpacing:1,marginBottom:10}},"Totals"),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
        ...[{l:"Min Due",v:fmt(totMin),c:"#f59e0b"},{l:"Total Debt",v:fmt(totBal),c:"#ef4444"},{l:"Credit Limit",v:fmt(totCL),c:"#6366f1"},{l:"Available",v:fmt(totAv),c:"#22c55e"}].map(t=>
          h("div",{key:t.l,style:{background:"#1a1f2e",borderRadius:7,padding:"8px 10px"}},
            h("div",{style:{fontSize:10,color:"#8b92a5",textTransform:"uppercase",letterSpacing:0.5,marginBottom:3}},t.l),
            h("div",{style:{fontSize:15,fontWeight:800,color:t.c}},t.v)
          )
        )
      )
    )
  );
}

// ── MAIN APP ─────────────────────────────────────────────────────────────────
function App(){
  const [periods,setPeriods]=useState(DP);
  const [paycheck,setPaycheck]=useState(DPC);
  const [activePid,setActivePid]=useState("period1");
  const [view,setView]=useState("tracker");
  const [editingId,setEditingId]=useState(null);
  const [newBill,setNewBill]=useState({name:"",dueDay:"",amount:"",autopay:false,lateFee:false});
  const [showAdd,setShowAdd]=useState(false);
  const [billFilter,setBillFilter]=useState("all");
  const [history,setHistory]=useState([]);
  const [showHist,setShowHist]=useState(false);
  const [lastSaved,setLastSaved]=useState(null);
  const [debts,setDebts]=useState(DD);
  const [editingDebt,setEditingDebt]=useState(null);
  const [showAddDebt,setShowAddDebt]=useState(false);
  const [newDebt,setNewDebt]=useState({name:"",minimum:"",balance:"",creditLine:"",asOf:""});
  const [ready,setReady]=useState(false);

  useEffect(()=>{
    (async()=>{
      try{
        const r=await storage.get("btrk-v6");
        if(r){
          const d=JSON.parse(r.value);
          if(d.periods)setPeriods(d.periods);
          if(d.paycheck)setPaycheck(d.paycheck);
          if(d.activePid)setActivePid(d.activePid);
          if(d.debts)setDebts(d.debts);
          if(d.history)setHistory(d.history||[]);
        }
      }catch(e){console.error("Load error",e);}
      setReady(true);
    })();
  },[]);

  const persist=useCallback((p,pc,ap,db,hist)=>{
    const payload=JSON.stringify({periods:p,paycheck:pc,activePid:ap,debts:db,history:hist||[]});
    storage.set("btrk-v6",payload).catch(()=>{});
    setLastSaved(new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
  },[]);

  const isSB=activePid==="snowball";
  const period=periods.find(p=>p.id===activePid)||periods[0];
  const col=PC[activePid]||PC.period1;
  const aBills=isSB?[]:[...period.bills].filter(b=>b.active).sort((a,b)=>a.dueDay-b.dueDay);
  const pcNum=parseFloat(paycheck[activePid])||0;
  const totBills=aBills.reduce((s,b)=>s+(parseFloat(b.amount)||0),0);
  const paidAmt=aBills.filter(b=>b.paid).reduce((s,b)=>s+(parseFloat(b.amount)||0),0);
  const paidCt=aBills.filter(b=>b.paid).length;
  const remaining=pcNum-totBills;
  const pct=pcNum>0?Math.round((totBills/pcNum)*100):0;
  const alerts=aBills.filter(b=>b.lateFee&&!b.autopay&&!b.paid);

  const mutP=nb=>{const next=periods.map(p=>p.id===activePid?{...p,bills:nb}:p);setPeriods(next);persist(next,paycheck,activePid,debts,history);};
  const togglePaid=id=>mutP(period.bills.map(b=>b.id===id?{...b,paid:!b.paid}:b));
  const updAmt=(id,v)=>mutP(period.bills.map(b=>b.id===id?{...b,amount:v}:b));
  const updDay=(id,d)=>mutP(period.bills.map(b=>b.id===id?{...b,dueDay:d}:b));
  const togOn=id=>mutP(period.bills.map(b=>b.id===id?{...b,active:!b.active}:b));
  const addBill=()=>{if(!newBill.name.trim())return;mutP([...period.bills,{...newBill,id:Date.now(),active:true,paid:false}]);setNewBill({name:"",dueDay:"",amount:"",autopay:false,lateFee:false});setShowAdd(false);};

  const closePeriod=()=>{
    const snap={period:col.label,date:new Date().toLocaleDateString(),paycheck:pcNum,totalBills:totBills,remaining};
    const h=[...history,snap];setHistory(h);
    const rb=period.bills.map(b=>({...b,paid:false}));
    const today=new Date();today.setHours(0,0,0,0);
    const up=SCHED.filter(d=>{const x=new Date(d);x.setHours(0,0,0,0);return x>today;});
    const nc1=up[0],nc2=up[1],ni=SCHED.indexOf(nc1),nb2=nextBonus(ni>=0?ni:0);
    const next=periods.map(p=>{
      if(p.id===activePid)return{...p,bills:rb};
      if(p.id==="period1"&&nc1)return{...p,paycheckDate:fpd(nc1)};
      if(p.id==="period2"&&nc2)return{...p,paycheckDate:fpd(nc2)};
      if(p.id==="period3"&&nb2)return{...p,paycheckDate:fpd(nb2)};
      return p;
    });
    setPeriods(next);persist(next,paycheck,activePid,debts,h);
  };

  const setPC=v=>{const pc={...paycheck,[activePid]:v};setPaycheck(pc);persist(periods,pc,activePid,debts,history);};
  const swP=id=>{setActivePid(id);setEditingId(null);setEditingDebt(null);persist(periods,paycheck,id,debts,history);};
  const updDF=(id,f,v)=>{const next=debts.map(d=>d.id===id?{...d,[f]:v}:d);setDebts(next);persist(periods,paycheck,activePid,next,history);};
  const addDebt=()=>{if(!newDebt.name.trim())return;const next=[...debts,{...newDebt,id:"d"+Date.now(),minimum:parseFloat(newDebt.minimum)||0,balance:parseFloat(newDebt.balance)||0,creditLine:parseFloat(newDebt.creditLine)||0}];setDebts(next);persist(periods,paycheck,activePid,next,history);setNewDebt({name:"",minimum:"",balance:"",creditLine:"",asOf:""});setShowAddDebt(false);};
  const delDebt=id=>{const next=debts.filter(d=>d.id!==id);setDebts(next);persist(periods,paycheck,activePid,next,history);};

  const sdebts=editingDebt?[...debts].sort((a,b)=>{const ai=DD.findIndex(d=>d.id===a.id),bi=DD.findIndex(d=>d.id===b.id);return(ai!==-1&&bi!==-1)?ai-bi:(parseFloat(a.balance)||0)-(parseFloat(b.balance)||0)}):[...debts].sort((a,b)=>(parseFloat(a.balance)||0)-(parseFloat(b.balance)||0));
  const totBal=debts.reduce((s,d)=>s+(parseFloat(d.balance)||0),0);
  const totMin=debts.reduce((s,d)=>s+(parseFloat(d.minimum)||0),0);
  const totCL=debts.reduce((s,d)=>s+(parseFloat(d.creditLine)||0),0);
  const totAv=debts.reduce((s,d)=>s+Math.max(0,(parseFloat(d.creditLine)||0)-(parseFloat(d.balance)||0)),0);
  const utilPct=totCL>0?Math.round((totBal/totCL)*100):0;

  if(!ready)return h("div",{style:{background:"#0f1117",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#8b92a5"}},"Loading…");

  const TABS=[...DP.map(p=>({id:p.id})),{id:"snowball"}];

  return h("div",{style:{fontFamily:"'Inter','Segoe UI',sans-serif",background:"#0f1117",minHeight:"100vh",color:"#e8eaf0"}},
    // Header
    h("div",{style:{background:"#13161f",borderBottom:"1px solid #1e2230",padding:"14px 16px 0",position:"sticky",top:0,zIndex:50}},
      h("div",{style:{maxWidth:680,margin:"0 auto"}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
          h("div",null,
            h("div",{style:{fontSize:10,letterSpacing:2,color:"#6b7280",textTransform:"uppercase"}},"Pay Period Manager"),
            h("div",{style:{fontSize:20,fontWeight:800,color:"#f0f2f8"}},"Bills Tracker")
          ),
          !isSB&&h("div",{style:{display:"flex",gap:6}},
            h("button",{onClick:()=>setView("tracker"),style:S.navBtn(view==="tracker",col.accent)},"Tracker"),
            h("button",{onClick:()=>setView("manage"),style:S.navBtn(view==="manage",col.accent)},"Manage")
          )
        ),
        h("div",{style:{display:"flex"}},
          ...TABS.map(t=>{
            const c=PC[t.id]||PC.period1,on=t.id===activePid;
            const sub=t.id==="snowball"?"Debt tracker":(periods.find(p=>p.id===t.id)||{}).paycheckDate||"";
            return h("button",{key:t.id,onClick:()=>swP(t.id),style:{flex:1,padding:"9px 3px 11px",background:on?"#0f1117":"transparent",border:"none",borderTop:"3px solid "+(on?c.accent:"transparent"),borderBottom:on?"1px solid #0f1117":"1px solid #1e2230",color:on?c.accent:"#6b7280",fontWeight:on?700:500,fontSize:11,cursor:"pointer",lineHeight:1.3}},
              h("div",null,c.label),
              h("div",{style:{fontSize:9,opacity:0.65,fontWeight:400,marginTop:1}},sub)
            );
          })
        )
      )
    ),
    // Body
    h("div",{style:{maxWidth:680,margin:"0 auto",padding:"14px 16px 90px"}},
      isSB
        ?h(SnowballView,{debts:sdebts,totBal,totMin,totCL,totAv,utilPct,editingDebt,setEditingDebt,onUpdate:updDF,onDelete:delDebt,showAdd:showAddDebt,setShowAdd:setShowAddDebt,newDebt,setNewDebt,onAddDebt:addDebt})
        :h(Fragment,null,
            // Paycheck inputs
            h("div",{style:{display:"flex",gap:10,marginBottom:12}},
              h("div",{style:{flex:1}},
                h("label",{style:S.lbl},"Paycheck"),
                h("div",{style:{position:"relative"}},
                  h("span",{style:{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#6b7280",fontSize:13}},"$"),
                  h("input",{value:paycheck[activePid],onChange:e=>setPC(e.target.value),style:{...S.inp,paddingLeft:24},type:"number",step:"0.01",placeholder:"0.00"})
                )
              ),
              h("div",{style:{flex:1}},
                h("label",{style:S.lbl},"Pay Date Label"),
                h("input",{value:period.paycheckDate,onChange:e=>{const next=periods.map(p=>p.id===activePid?{...p,paycheckDate:e.target.value}:p);setPeriods(next);persist(next,paycheck,activePid,debts,history);},style:S.inp,placeholder:"e.g. Jun 26"})
              )
            ),
            // Summary cards
            h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}},
              h(Card,{label:"Total Bills",value:fmt(totBills),sub:pct+"% of check",color:"#ef4444"}),
              h(Card,{label:"Still Owed",value:fmt(totBills-paidAmt),sub:(aBills.length-paidCt)+" unpaid",color:"#f59e0b"}),
              h(Card,{label:"Transfer Out",value:fmt(remaining),sub:"to personal acct",color:remaining>=0?"#22c55e":"#ef4444"})
            ),
            // Progress bar
            h("div",{style:{background:"#1a1f2e",borderRadius:8,padding:"9px 13px",marginBottom:12,border:"1px solid #1e2230"}},
              h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,color:"#8b92a5",marginBottom:5}},
                h("span",null,"Paid this period"),
                h("span",null,paidCt+"/"+aBills.length+" · "+fmt(paidAmt)+" of "+fmt(totBills))
              ),
              h("div",{style:{background:"#2a2f3e",borderRadius:4,height:6}},
                h("div",{style:{width:(aBills.length?paidCt/aBills.length*100:0)+"%",height:"100%",background:"linear-gradient(90deg,"+col.accent+","+col.dark+")",borderRadius:4,transition:"width 0.3s"}})
              )
            ),
            // Alert
            alerts.length>0&&view==="tracker"&&h("div",{style:{background:"#3b1500",border:"1px solid #92400e",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#fcd34d"}},
              h("strong",null,"⚠️ Manual payment needed: "),alerts.map(b=>b.name).join(" · ")
            ),
            // Tracker view
            view==="tracker"&&h(Fragment,null,
              // Filter bar
              h("div",{style:{display:"flex",gap:6,marginBottom:10,alignItems:"center"}},
                h("span",{style:{fontSize:11,color:"#6b7280",marginRight:2}},"Show:"),
                ...[{k:"all",l:"All"},{k:"auto",l:"⚡ Auto"},{k:"manual",l:"✋ Manual"}].map(f=>
                  h("button",{key:f.k,onClick:()=>setBillFilter(f.k),style:{padding:"5px 11px",borderRadius:20,fontSize:12,fontWeight:600,cursor:"pointer",border:"none",background:billFilter===f.k?col.accent:"#1a1f2e",color:billFilter===f.k?"#fff":"#6b7280",outline:"2px solid "+(billFilter===f.k?col.accent:"#1e2230")}},f.l)
                ),
                h("button",{onClick:()=>setShowHist(!showHist),style:{fontSize:11,color:col.accent,background:"none",border:"none",cursor:"pointer",padding:0,marginLeft:"auto"}},showHist?"Hide history":"History")
              ),
              // Filter subtotal
              billFilter!=="all"&&(()=>{
                const fil=aBills.filter(b=>billFilter==="auto"?b.autopay:!b.autopay);
                const st=fil.reduce((s,b)=>s+(parseFloat(b.amount)||0),0);
                const sp=fil.filter(b=>b.paid).reduce((s,b)=>s+(parseFloat(b.amount)||0),0);
                const sc=fil.filter(b=>b.paid).length;
                return h("div",{style:{background:billFilter==="auto"?"#1a1f2e":"#1f1a0e",border:"1px solid "+(billFilter==="auto"?"#6366f133":"#f59e0b33"),borderRadius:8,padding:"8px 13px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}},
                  h("span",{style:{fontSize:12,color:billFilter==="auto"?col.accent:"#f59e0b",fontWeight:600}},(billFilter==="auto"?"⚡ Autopay":"✋ Manual")+" — "+sc+"/"+fil.length+" paid"),
                  h("span",{style:{fontSize:13,fontWeight:800,color:"#f0f2f8"}},fmt(sp)," ",h("span",{style:{color:"#8b92a5",fontWeight:400}},"of "+fmt(st)))
                );
              })(),
              // History
              showHist&&history.length>0&&h("div",{style:{background:"#1a1f2e",borderRadius:8,border:"1px solid #1e2230",padding:"10px 12px",marginBottom:12}},
                h("div",{style:{fontSize:10,color:"#6b7280",textTransform:"uppercase",letterSpacing:1,marginBottom:7}},"Closed Periods"),
                ...[...history].reverse().map((hh,i)=>
                  h("div",{key:i,style:{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<history.length-1?"1px solid #1e2230":"none",fontSize:12}},
                    h("span",{style:{color:"#9ca3af"}},hh.period," ",h("span",{style:{color:"#6b7280"}},"("+hh.date+")")),
                    h("span",{style:{color:"#22c55e",fontWeight:600}},fmt(hh.remaining)+" transferred")
                  )
                )
              ),
              // Bill list
              h("div",{style:{display:"flex",flexDirection:"column",gap:5}},
                ...aBills.filter(b=>billFilter==="all"?true:billFilter==="auto"?b.autopay:!b.autopay).map(bill=>
                  h(BillRow,{key:bill.id,bill,onTogglePaid:()=>togglePaid(bill.id),onAmt:v=>updAmt(bill.id,v),onDayChange:d=>updDay(bill.id,d),editingId,setEditingId,accent:col.accent})
                )
              ),
              // Save & Bake
              h(SaveBakeButton,{periods,paycheck,activePid,debts,history,lastSaved}),
              // Reset section
              h("div",{style:{marginTop:10,background:"#1a1f2e",border:"1px solid #2a2f3e",borderRadius:10,padding:"12px 14px"}},
                h("div",{style:{fontSize:12,color:"#9ca3af",marginBottom:4,fontWeight:600}},"Start Next Pay Cycle"),
                h("div",{style:{fontSize:11,color:"#6b7280",marginBottom:10,lineHeight:1.5}},"Clears all paid checkmarks and advances dates. Your amounts and history are kept."),
                h(ResetButton,{onConfirm:closePeriod,label:col.label,accent:col.accent,dark:col.dark})
              )
            ),
            // Manage view
            view==="manage"&&h(ManageBills,{bills:period.bills,onToggle:togOn,onAdd:addBill,newBill,setNewBill,showAdd,setShowAdd,accent:col.accent,periodLabel:col.label,onDelete:id=>mutP(period.bills.filter(b=>b.id!==id))})
          )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
